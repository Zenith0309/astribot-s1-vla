# pi05 微调配置 — 星尘 S1 仿真「抓球入箱」【v1 历史存档，请勿用它重训】
#
# 这份配置是 2026-07-26/27 训练第一版模型时实际跑的参数，原样保留作为对照记录。
# v1 结果：137 条窄分布数据（14×22cm）+ 30000 步 → 因果混淆（忽略视觉，走记忆平均动作）。
# 产物：outputs/pi05_pick_ball/train_pick_ball/checkpoint-{20000,25000,30000}
#
# ⚠️ norm 落点和 checkpoint 落点都由【配置文件名】派生：
#      norm       -> <normalization_base_path>/<配置名>/...
#      checkpoint -> <output_dir>/<配置名>/checkpoint-*
#    所以复用这个文件名重训会覆盖 v1 产物。重训请用 train_pick_ball_v2.yaml。
#
# 放到 astribot_pi05-main/astribot_pi05/configs/train_example/ 下再用 train.sh 引用
# 权重需先解压: unzip /data0/tzs/astribot/cheakpoint/pi05_base_bfloat16.zip -d /data0/tzs/astribot/cheakpoint/

### 模型
model_name_or_path: "/data0/tzs/astribot/cheakpoint/pi05_base_bfloat16"  # 解压后的权重目录
attn_implementation: "flash_attention_2"   # 没装 flash-attn 就改 "eager"
torch_dtype: "bfloat16"

model_kwargs:
  chunk_size: 32
  # ===== 多卡 4090 档（ZeRO-2 分片显存）=====
  freeze_vision_encoder: true       # 冻结视觉编码器（小数据，冻结防过拟合）
  train_expert_only: true           # 只训动作 expert，冻结主干（小数据+稳，也省显存）
  GPU_memory_opt_level: 1           # 多卡分片后无需最狠的检查点；OOM 再改 2
  # 若卡多且想更充分微调：train_expert_only=false（ZeRO-2 分片下 4090 可尝试）

### Processor / 归一化
processor_kwargs:
  normalization_mode:
    state: "quantile"
    actions: "quantile"
  # 必须绝对路径：compute_norm_stats.sh 与 train.sh 工作目录不同，相对路径会错位
  normalization_base_path: "/data0/tzs/astribot/astribot_pi05/astribot_pi05/outputs/pi05_pick_ball/norm"
  default_prompts:
    astribot: "pick the ball and place it into the box"

### 数据集（hdf5_to_pi05.py 转出的目录）
robot_datasets:
  - repo_id_list:
      - ["pi05_pick_ball", 0.9]     # 90% 训练 / 10% 验证
    dataset_root: "/data0/tzs/astribot/datasets"   # 上级目录；实际集在 <root>/pi05_pick_ball

### 训练
# 多卡 4090：用 ZeRO-2 分片优化器/梯度；启动加 -n <卡数>
deepspeed: "configs/deepspeed/zero2.json"
max_steps: 30000                    # v1 实跑值。事后判定：对 137 条数据而言过头了
per_device_train_batch_size: 2      # 每张 4090；OOM 降到 1
gradient_accumulation_steps: 4      # 有效 batch = 2 × 卡数 × 4（如 4 卡 = 32）
dataloader_num_workers: 8

learning_rate: !!float "3e-5"       # 微调用比从头训小的 lr
lr_scheduler_type: "cosine_with_min_lr"
lr_scheduler_kwargs:
  min_lr: !!float "3e-6"
warmup_steps: 500

output_dir: "outputs/pi05_pick_ball"
overwrite_output_dir: false
save_steps: 5000                    # v1 实跑值，只留 3 个 checkpoint，挑选空间太小
save_total_limit: 3
save_safetensors: true

logging_steps: 25
seed: 42
